name: Docker Publish

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    # Pinned: ubuntu-latest became 26.04, where the apptainer .deb cannot install.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ghcr.io requires lowercase image names
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Apptainer cannot pull from ghcr.io without credentials on the cluster,
      # so the same image is also published as an ORAS artifact (-sif tags).
      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.4

      - name: Build and push Apptainer image
        env:
          VERSION: ${{ github.ref_name }}
        # Log in first: new ghcr.io packages are private, so even pulling the
        # image we just pushed needs credentials (same order as the template).
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login \
            --username "${{ github.actor }}" --password-stdin "docker://${REGISTRY}"
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login \
            --username "${{ github.actor }}" --password-stdin "oras://${REGISTRY}"
          apptainer build image.sif "docker://${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          apptainer push image.sif "oras://${REGISTRY}/${IMAGE_NAME}:${VERSION}-sif"
          apptainer push image.sif "oras://${REGISTRY}/${IMAGE_NAME}:latest-sif"
