[project]
name = "tabicl-reproduction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MegaByteTron", email = "y2r2497h6t@privaterelay.appleid.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openml>=0.15.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
]

[project.scripts]
tabicl-reproduction = "tabicl_reproduction:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]
notebook = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Allows test files with the same name in different folders (tests/data, tests/model).
# Network tests are skipped by default; run them with: uv run pytest -m network
addopts = "--import-mode=importlib -m 'not network'"
markers = ["network: needs internet access (OpenML)"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # Import sorting
    "B",   # Common bug patterns
    "UP",  # Python modernization
]
# Ruff's formatter does not wrap comments automatically.
# Avoid lint errors from long comments in upstream code.
ignore = ["E501"]

# torch's type stubs make ty flag standard nn.Module idioms (buffers, forward overrides)
[[tool.ty.overrides]]
include = ["src/tabicl_reproduction/model/model.py"]

[tool.ty.overrides.rules]
invalid-mutable-override = "ignore"
invalid-method-override = "ignore"
call-non-callable = "ignore"
not-subscriptable = "ignore"
no-matching-overload = "ignore"
unresolved-attribute = "ignore"
